# ============================================================================
#  Tank Level Sensor  —  ESPHome configuration
# ============================================================================
#  Compiled to native ESP32 firmware by the `esphome` CLI.
#  See README.md for hardware, installation, flashing and calibration.
#
#  Secrets (Wi-Fi, fallback AP, API key) live in secrets.yaml (gitignored)
#  and are referenced below with  !secret <name> .
# ============================================================================

substitutions:
  device_name: "blackwater-tank-monitor"
  device_comment: "Non-invasive SCAD TM1 Style Capacitive Blackwater Level Sensor"

  # ---------------- CALIBRATION VALUES (edit after field calibration) --------
  # Two-point calibration: record the steady-state raw reading when the tank
  # is empty (cal_raw_empty) and at 100% full (cal_raw_full). See README §6.
  cal_raw_empty: "300.0"   # raw capacitance at 0" (empty)
  cal_raw_full: "750.0"    # raw capacitance at 30" (full)
  cal_min_percent: "0.0"   # lower clamp
  cal_max_percent: "100.0" # upper clamp

  # Set to "true" to hide the raw diagnostic reading from Home Assistant
  # once calibration is complete.
  internal_raw: "false"

  # --- FDC1004 (I2C capacitance-to-digital converter) ---
  fdc_channel: "1"            # CIN1..CIN4 electrode
  fdc_capdac: "0"             # offset DAC 0-31; raise if the raw reading saturates at the limits
  sample_interval: "5s"       # how often to read the capacitance

esphome:
  name: ${device_name}
  comment: ${device_comment}

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Custom FDC1004 component (ships with this repo; no third-party dependency) ---
external_components:
  - source:
      type: local
      path: components
    components: [fdc1004]

# --- I2C bus to the FDC1004 ---
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

# --- Network Connectivity ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback access point in case the Wi-Fi connection fails
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

# --- Logging ---
logger:
  level: INFO

# --- Native Home Assistant Integration ---
api:
  encryption:
    key: !secret api_encryption_key

# --- Over-The-Air Update Capability ---
ota:
  - platform: esphome

# Makes the fallback Wi-Fi AP (above) usable for troubleshooting/config.
captive_portal:

# --- FDC1004 capacitance sensor (CIN1 -> Foil A, SHLD -> Foil B) ---
fdc1004:
  id: fdc1004_hub
  address: 0x50

sensor:
  # Raw capacitance measurement from the FDC1004
  - platform: fdc1004
    name: "Blackwater Tank Capacitance Raw"
    id: raw_capacitance
    channel: ${fdc_channel}
    capdac: ${fdc_capdac}
    internal: ${internal_raw}
    update_interval: ${sample_interval}
    filters:
      # Sliding-window moving average to smooth liquid movement underway
      - sliding_window_moving_average:
          window_size: 15
          send_every: 3
    on_value:
      # Recompute the level every time a (filtered) raw value is published
      - sensor.template.publish:
          id: blackwater_level_percent
          state: !lambda |-
            float raw = id(raw_capacitance).state;
            float pct = ((raw - ${cal_raw_empty}) / (${cal_raw_full} - ${cal_raw_empty})) * 100.0;

            // Clamp between the configured limits
            if (pct < ${cal_min_percent}) return ${cal_min_percent};
            if (pct > ${cal_max_percent}) return ${cal_max_percent};
            return pct;

  # Calibrated tank level percentage output (driven by the raw sensor above)
  - platform: template
    name: "Blackwater Tank Level"
    id: blackwater_level_percent
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    accuracy_decimals: 1
    state_class: "measurement"
    # NOTE: ESPHome has no `device_class: fill` (removed); % still renders via unit_of_measurement.
    update_interval: never   # published externally via sensor.template.publish

text_sensor:
  - platform: version
    name: "Blackwater Monitor ESPHome Version"
