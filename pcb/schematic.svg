<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
  <style>
    .box{fill:#ffffff;stroke:#111;stroke-width:2}
    .dash{fill:#ffffff;stroke:#777;stroke-width:2;stroke-dasharray:6 4}
    .wire{stroke:#111;stroke-width:2;fill:none}
    .lbl{font-size:13px;fill:#111}
    .lbl-s{font-size:11px;fill:#444}
    .lbl-b{font-size:14px;fill:#111;font-weight:bold}
  </style>
  <text x="24" y="28" class="lbl-b">Tank Level Sensor — PCB block schematic (5 V input)</text>

  <!-- Left column (power) -->
  <rect x="24" y="60" width="220" height="60" class="box"/>
  <text x="134" y="85" text-anchor="middle" class="lbl-b">12V Marine House Bank</text>
  <text x="134" y="102" text-anchor="middle" class="lbl-s">+12V / GND</text>

  <rect x="24" y="150" width="220" height="60" class="box"/>
  <text x="134" y="175" text-anchor="middle" class="lbl-b">LM2596 Buck Module</text>
  <text x="134" y="192" text-anchor="middle" class="lbl-s">12V -&gt; 5V (external)</text>

  <rect x="24" y="240" width="220" height="60" class="box"/>
  <text x="134" y="265" text-anchor="middle" class="lbl-b">+5V Input (J1)</text>
  <text x="134" y="282" text-anchor="middle" class="lbl-s">5V / GND in</text>

  <rect x="24" y="330" width="220" height="60" class="box"/>
  <text x="134" y="355" text-anchor="middle" class="lbl-b">AMS1117-3.3 (U3)</text>
  <text x="134" y="372" text-anchor="middle" class="lbl-s">5V -&gt; 3.3V LDO</text>

  <!-- power arrows down the left column -->
  <line x1="134" y1="120" x2="134" y2="150" class="wire"/>
  <line x1="134" y1="210" x2="134" y2="240" class="wire"/>
  <line x1="134" y1="300" x2="134" y2="330" class="wire"/>
  <text x="145" y="140" class="lbl-s">12V</text>
  <text x="145" y="230" class="lbl-s">+5V</text>
  <text x="145" y="320" class="lbl-s">3.3V</text>

  <!-- ESP32 -->
  <rect x="330" y="180" width="250" height="240" class="box"/>
  <text x="455" y="205" text-anchor="middle" class="lbl-b">ESP32-WROOM-32E (U1)</text>
  <text x="455" y="400" text-anchor="middle" class="lbl-s">GPIO21 = SDA, GPIO22 = SCL</text>

  <!-- FDC1004 -->
  <rect x="640" y="180" width="220" height="240" class="box"/>
  <text x="750" y="205" text-anchor="middle" class="lbl-b">TI FDC1004 (U2)</text>
  <text x="750" y="300" text-anchor="middle" class="lbl-s">I2C addr 0x50</text>
  <text x="750" y="320" text-anchor="middle" class="lbl-s">VDD=pin8 GND=pin7</text>

  <!-- 3V3 from LDO to ESP32 -->
  <line x1="244" y1="360" x2="330" y2="360" class="wire"/>
  <text x="287" y="353" text-anchor="middle" class="lbl">3.3V</text>
  <!-- 3V3 to FDC1004 -->
  <line x1="455" y1="300" x2="640" y2="300" class="wire"/>
  <text x="547" y="293" text-anchor="middle" class="lbl">3.3V</text>

  <!-- I2C ESP32 <-> FDC1004 -->
  <line x1="580" y1="240" x2="640" y2="240" class="wire"/>
  <line x1="580" y1="260" x2="640" y2="260" class="wire"/>
  <text x="610" y="233" text-anchor="middle" class="lbl-s">SDA</text>
  <text x="610" y="275" text-anchor="middle" class="lbl-s">SCL</text>

  <!-- Foil connectors -->
  <rect x="640" y="460" width="220" height="80" class="box"/>
  <text x="750" y="485" text-anchor="middle" class="lbl-b">Foil Connectors J2/J3</text>
  <text x="750" y="505" text-anchor="middle" class="lbl-s">CIN1 / SHLD</text>
  <text x="750" y="522" text-anchor="middle" class="lbl-s">to Foil A / Foil B</text>

  <!-- FDC1004 -> foil connectors -->
  <line x1="750" y1="420" x2="750" y2="460" class="wire"/>
  <text x="760" y="445" class="lbl-s">CIN1 / SHLD</text>

  <!-- Optional USB-UART -->
  <rect x="330" y="460" width="250" height="70" class="dash"/>
  <text x="455" y="485" text-anchor="middle" class="lbl-b">USB-UART CP2102 (optional)</text>
  <text x="455" y="505" text-anchor="middle" class="lbl-s">for programming; GPIO1=TX GPIO3=RX</text>
  <line x1="455" y1="420" x2="455" y2="460" class="wire" stroke="#777"/>

  <!-- notes -->
  <text x="24" y="570" class="lbl-b">Layout notes</text>
  <text x="24" y="588" class="lbl-s">Guard the CIN1 (Foil A) trace with SHLD copper. Keep the ESP32 antenna over the board edge.</text>
  <text x="24" y="606" class="lbl-s">Full netlist, footprints and PCBWay steps are in pcb/DESIGN.md; parts in pcb/BOM.md.</text>
</svg>
