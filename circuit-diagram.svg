<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#111; stroke-width:2 }
    .pin { fill:#e8e8e8; stroke:#111; stroke-width:2 }
    .wire { stroke:#111; stroke-width:2.5; fill:none }
    .dash { stroke:#111; stroke-width:1.6; fill:none; stroke-dasharray:7 5 }
    .lbl  { font-size:13px; fill:#111 }
    .lbl-s{ font-size:11px; fill:#444 }
    .lbl-b{ font-size:14px; fill:#111; font-weight:bold }
    .lbl-v{ font-size:13px; fill:#111; font-weight:bold }
  </style>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#111">Non-Invasive Capacitive Blackwater Tank Level Sensor</text>
  <text x="30" y="54" class="lbl-s">Installation line drawing — power and capacitive sensing wiring. See README §3.</text>

  <!-- Battery -->
  <rect x="40" y="210" width="150" height="180" class="box"/>
  <text x="115" y="285" text-anchor="middle" class="lbl-b">12V MARINE</text>
  <text x="115" y="303" text-anchor="middle" class="lbl-b">HOUSE BATTERY</text>
  <text x="115" y="323" text-anchor="middle" class="lbl-s">(12.0-14.6 V)</text>
  <text x="115" y="341" text-anchor="middle" class="lbl-s">house bank</text>
  <circle cx="115" cy="210" r="6" class="pin"/>
  <circle cx="115" cy="390" r="6" class="pin"/>
  <text x="130" y="215" class="lbl">+</text>
  <text x="130" y="395" class="lbl">-</text>

  <!-- Buck -->
  <rect x="300" y="180" width="220" height="200" class="box"/>
  <text x="410" y="284" text-anchor="middle" class="lbl-b">12V to 5V</text>
  <text x="410" y="302" text-anchor="middle" class="lbl-b">DC-DC BUCK</text>
  <text x="410" y="322" text-anchor="middle" class="lbl-s">(LM2596)</text>
  <circle cx="300" cy="230" r="6" class="pin"/>
  <circle cx="300" cy="360" r="6" class="pin"/>
  <circle cx="520" cy="230" r="6" class="pin"/>
  <circle cx="520" cy="360" r="6" class="pin"/>
  <text x="250" y="226" text-anchor="end" class="lbl-s">VIN+</text>
  <text x="250" y="365" text-anchor="end" class="lbl-s">VIN-</text>
  <text x="532" y="226" class="lbl-s">+5V</text>
  <text x="532" y="365" class="lbl-s">GND</text>

  <!-- ESP32 -->
  <rect x="600" y="150" width="220" height="280" class="box"/>
  <text x="710" y="270" text-anchor="middle" class="lbl-b">ESP32-WROOM-32</text>
  <text x="710" y="288" text-anchor="middle" class="lbl-b">Dev Board</text>
  <circle cx="600" cy="230" r="6" class="pin"/>
  <circle cx="600" cy="360" r="6" class="pin"/>
  <circle cx="820" cy="190" r="6" class="pin"/>
  <circle cx="820" cy="260" r="6" class="pin"/>
  <circle cx="820" cy="325" r="6" class="pin"/>
  <circle cx="820" cy="385" r="6" class="pin"/>
  <text x="590" y="226" text-anchor="end" class="lbl-s">VIN/5V</text>
  <text x="590" y="365" text-anchor="end" class="lbl-s">GND</text>
  <text x="830" y="185" class="lbl-s">3V3</text>
  <text x="830" y="265" class="lbl-s">GPIO21 (SDA)</text>
  <text x="830" y="330" class="lbl-s">GPIO22 (SCL)</text>
  <text x="830" y="390" class="lbl-s">GND</text>

  <!-- FDC1004 -->
  <rect x="960" y="170" width="230" height="270" class="box"/>
  <text x="1075" y="270" text-anchor="middle" class="lbl-b">FDC1004</text>
  <text x="1075" y="288" text-anchor="middle" class="lbl-b">CAP-SENSOR</text>
  <text x="1075" y="306" text-anchor="middle" class="lbl-s">(I2C 0x50)</text>
  <circle cx="960" cy="190" r="6" class="pin"/>
  <circle cx="960" cy="260" r="6" class="pin"/>
  <circle cx="960" cy="325" r="6" class="pin"/>
  <circle cx="960" cy="385" r="6" class="pin"/>
  <circle cx="1190" cy="250" r="6" class="pin"/>
  <circle cx="1190" cy="340" r="6" class="pin"/>
  <text x="950" y="186" text-anchor="end" class="lbl-s">VDD</text>
  <text x="950" y="265" text-anchor="end" class="lbl-s">SDA</text>
  <text x="950" y="330" text-anchor="end" class="lbl-s">SCL</text>
  <text x="950" y="390" text-anchor="end" class="lbl-s">GND</text>
  <text x="1200" y="245" class="lbl-s">CIN1</text>
  <text x="1200" y="345" class="lbl-s">SHLD</text>

  <!-- Tank -->
  <rect x="1260" y="80" width="150" height="480" class="box"/>
  <text x="1335" y="72" text-anchor="middle" class="lbl-b">BLACKWATER TANK</text>
  <text x="1335" y="588" text-anchor="middle" class="lbl-s">poly / fiberglass</text>
  <rect x="1305" y="95" width="22" height="440" class="box"/>
  <rect x="1355" y="95" width="22" height="440" class="box"/>
  <text x="1316" y="300" transform="rotate(-90 1316 300)" text-anchor="middle" class="lbl-v">FOIL A</text>
  <text x="1366" y="300" transform="rotate(-90 1366 300)" text-anchor="middle" class="lbl-v">FOIL B</text>
  <text x="1341" y="150" text-anchor="middle" class="lbl-s">~1.5-2&quot; gap</text>
  <line x1="1260" y1="300" x2="1410" y2="300" class="dash"/>
  <text x="1416" y="292" text-anchor="end" class="lbl-s">waste level</text>

  <!-- Wires: power -->
  <polyline points="115,210 215,210 215,230 300,230" class="wire"/>
  <text x="160" y="203" class="lbl">+12V</text>
  <polyline points="115,390 215,390 215,360 300,360" class="wire"/>
  <text x="160" y="402" class="lbl">GND</text>
  <line x1="520" y1="230" x2="600" y2="230" class="wire"/>
  <text x="560" y="222" text-anchor="middle" class="lbl">5V</text>
  <line x1="520" y1="360" x2="600" y2="360" class="wire"/>
  <text x="560" y="375" text-anchor="middle" class="lbl">GND</text>

  <!-- Wires: I2C + 3.3V -->
  <line x1="820" y1="190" x2="960" y2="190" class="wire"/>
  <text x="890" y="183" text-anchor="middle" class="lbl-s">3.3V</text>
  <line x1="820" y1="260" x2="960" y2="260" class="wire"/>
  <text x="890" y="253" text-anchor="middle" class="lbl-s">SDA</text>
  <line x1="820" y1="325" x2="960" y2="325" class="wire"/>
  <text x="890" y="318" text-anchor="middle" class="lbl-s">SCL</text>
  <line x1="820" y1="385" x2="960" y2="385" class="wire"/>
  <text x="890" y="405" text-anchor="middle" class="lbl-s">GND</text>

  <!-- Wires: foils -->
  <polyline points="1190,250 1245,250 1245,105 1316,105" class="wire"/>
  <text x="1250" y="243" class="lbl-s">CIN1 to Foil A</text>
  <polyline points="1190,340 1255,340 1255,88 1366,88" class="wire"/>
  <text x="1250" y="377" class="lbl-s">SHLD to Foil B</text>

  <!-- Ground symbol on the GND net -->
  <line x1="560" y1="360" x2="560" y2="383" class="wire"/>
  <line x1="546" y1="383" x2="574" y2="383" class="wire"/>
  <line x1="551" y1="390" x2="569" y2="390" class="wire"/>
  <line x1="556" y1="397" x2="564" y2="397" class="wire"/>

  <!-- Notes -->
  <text x="30" y="452" class="lbl-b">Notes</text>
  <text x="30" y="474" class="lbl-s">&#8226; Foil strips are stuck to the OUTSIDE of the non-metallic tank (no holes/probes).</text>
  <text x="30" y="492" class="lbl-s">&#8226; Strips run vertical ~30&quot;, from 1&quot; above the floor to the 30&quot; max level.</text>
  <text x="30" y="510" class="lbl-s">&#8226; Strips are parallel with a 1.5-2.0&quot; gap; the wall + liquid form the dielectric.</text>
  <text x="30" y="528" class="lbl-s">&#8226; Foil A to FDC1004 CIN1 (signal). Foil B to FDC1004 SHLD (driven shield).</text>
  <text x="30" y="546" class="lbl-s">&#8226; FDC1004 powered from ESP32 3.3V; I2C on GPIO21 (SDA) / GPIO22 (SCL) with 4.7k pull-ups.</text>
  <text x="30" y="564" class="lbl-s">&#8226; COMMON GROUND: battery - = buck GND = ESP32 GND = FDC1004 GND.</text>
  <text x="30" y="582" class="lbl-s">&#8226; Moisture-proof the solder joints (liquid tape / adhesive-lined heat-shrink).</text>
</svg>
