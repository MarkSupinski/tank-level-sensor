<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#111; stroke-width:2 }
    .pin { fill:#e8e8e8; stroke:#111; stroke-width:2 }
    .wire { stroke:#111; stroke-width:2.5; fill:none }
    .dash { stroke:#111; stroke-width:1.6; fill:none; stroke-dasharray:7 5 }
    .lbl  { font-size:13px; fill:#111 }
    .lbl-s{ font-size:11px; fill:#444 }
    .lbl-b{ font-size:14px; fill:#111; font-weight:bold }
    .lbl-v{ font-size:13px; fill:#111; font-weight:bold }
  </style>

  <!-- ======================= Header ======================= -->
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#111">Non-Invasive Capacitive Blackwater Tank Level Sensor</text>
  <text x="30" y="54" class="lbl-s">Installation line drawing — power and foil-strip sensor wiring. See README §3 for the full ASCII schematic.</text>

  <!-- ======================= Battery ======================= -->
  <rect x="40" y="185" width="150" height="190" class="box"/>
  <text x="115" y="266" text-anchor="middle" class="lbl-b">12V MARINE</text>
  <text x="115" y="284" text-anchor="middle" class="lbl-b">HOUSE BATTERY</text>
  <text x="115" y="304" text-anchor="middle" class="lbl-s">(12.0 – 14.6 V)</text>
  <text x="115" y="322" text-anchor="middle" class="lbl-s">house bank</text>
  <circle cx="115" cy="185" r="6" class="pin"/>
  <circle cx="115" cy="375" r="6" class="pin"/>
  <text x="130" y="190" class="lbl" font-size="15">+</text>
  <text x="130" y="380" class="lbl" font-size="15">&#8722;</text>

  <!-- ======================= Buck converter ======================= -->
  <rect x="290" y="158" width="210" height="214" class="box"/>
  <text x="395" y="258" text-anchor="middle" class="lbl-b">12V &#8594; 5V</text>
  <text x="395" y="276" text-anchor="middle" class="lbl-b">DC-DC BUCK</text>
  <text x="395" y="296" text-anchor="middle" class="lbl-s">(LM2596)</text>
  <circle cx="290" cy="208" r="6" class="pin"/>
  <circle cx="290" cy="338" r="6" class="pin"/>
  <circle cx="500" cy="208" r="6" class="pin"/>
  <circle cx="500" cy="338" r="6" class="pin"/>
  <text x="240" y="204" text-anchor="end" class="lbl-s">VIN+</text>
  <text x="240" y="343" text-anchor="end" class="lbl-s">VIN&#8722;</text>
  <text x="512" y="204" class="lbl-s">+5V</text>
  <text x="512" y="343" class="lbl-s">GND</text>

  <!-- ======================= ESP32 ======================= -->
  <rect x="580" y="120" width="200" height="260" class="box"/>
  <text x="680" y="240" text-anchor="middle" class="lbl-b">ESP32-WROOM-32</text>
  <text x="680" y="258" text-anchor="middle" class="lbl-b">Development Board</text>
  <circle cx="580" cy="208" r="6" class="pin"/>
  <circle cx="580" cy="338" r="6" class="pin"/>
  <circle cx="780" cy="225" r="6" class="pin"/>
  <circle cx="780" cy="335" r="6" class="pin"/>
  <text x="570" y="204" text-anchor="end" class="lbl-s">VIN/5V</text>
  <text x="570" y="343" text-anchor="end" class="lbl-s">GND</text>
  <text x="790" y="220" class="lbl-s">GPIO4 (T0)</text>
  <text x="790" y="340" class="lbl-s">GND</text>

  <!-- ======================= Tank ======================= -->
  <rect x="880" y="70" width="220" height="520" class="box"/>
  <text x="990" y="63" text-anchor="middle" class="lbl-b">BLACKWATER TANK</text>
  <text x="990" y="618" text-anchor="middle" class="lbl-s">polyethylene / fiberglass</text>

  <!-- Foil strips (on the OUTSIDE wall) -->
  <rect x="945" y="92" width="26" height="466" class="box"/>
  <rect x="1015" y="92" width="26" height="466" class="box"/>
  <text x="958" y="300" transform="rotate(-90 958 300)" text-anchor="middle" class="lbl-v">FOIL A</text>
  <text x="1028" y="300" transform="rotate(-90 1028 300)" text-anchor="middle" class="lbl-v">FOIL B</text>
  <text x="1002" y="112" text-anchor="middle" class="lbl-s">~1.5–2&quot; gap</text>
  <line x1="880" y1="300" x2="1120" y2="300" class="dash"/>
  <text x="1112" y="292" text-anchor="end" class="lbl-s">waste level (illustrative)</text>

  <!-- ======================= Wires ======================= -->
  <polyline points="115,185 215,185 215,208 290,208" class="wire"/>
  <text x="160" y="178" class="lbl">+12V</text>
  <polyline points="115,375 215,375 215,338 290,338" class="wire"/>
  <text x="160" y="391" class="lbl">GND</text>
  <line x1="500" y1="208" x2="580" y2="208" class="wire"/>
  <text x="540" y="200" text-anchor="middle" class="lbl">5V</text>
  <line x1="500" y1="338" x2="580" y2="338" class="wire"/>
  <text x="540" y="355" text-anchor="middle" class="lbl">GND</text>
  <line x1="540" y1="338" x2="540" y2="378" class="wire"/>
  <line x1="528" y1="378" x2="552" y2="378" class="wire"/>
  <line x1="532" y1="385" x2="548" y2="385" class="wire"/>
  <line x1="536" y1="392" x2="544" y2="392" class="wire"/>
  <polyline points="780,225 840,225 840,92 958,92" class="wire"/>
  <text x="848" y="214" class="lbl-s">touch signal</text>
  <polyline points="780,335 840,335 840,558 1028,558" class="wire"/>
  <text x="848" y="548" class="lbl-s">ground / shield</text>

  <!-- ======================= Notes ======================= -->
  <text x="30" y="452" class="lbl-b">Notes</text>
  <text x="30" y="474" class="lbl-s">&#8226;  Foil strips are stuck to the OUTSIDE of the non-metallic tank (no holes / probes).</text>
  <text x="30" y="492" class="lbl-s">&#8226;  Strips run vertically the tank depth (~30&quot;), from 1&quot; above the floor to the 30&quot; max level.</text>
  <text x="30" y="510" class="lbl-s">&#8226;  Strips are parallel with a uniform 1.5&#8211;2.0&quot; gap; the plastic wall and liquid act as the dielectric.</text>
  <text x="30" y="528" class="lbl-s">&#8226;  COMMON GROUND: battery &#8722; = buck VIN&#8722; = buck GND = ESP32 GND = Foil Strip B.</text>
  <text x="30" y="546" class="lbl-s">&#8226;  Solder joints must be moisture-proofed (liquid tape / adhesive-lined heat-shrink).</text>
</svg>
